name: release
on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Releases come from main, which ci has already linted and tested, so
  # nothing is run again here. Instead, the tag must be a signed vX.Y.Z on a
  # commit of main whose ci run passed.
  verify:
    name: verify
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # find the tagged commit's ci run
    steps:
      - name: harden_runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: validate_tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The tag trigger is a glob, so "v*.*.*" also matches tags such as
          # "vfoo.bar.baz". Stop before anything is deployed or published.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$TAG' is not a valid release tag; expected vX.Y.Z"
            exit 1
          fi

      - name: verify_tag_signature
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Only purpleclay may sign releases, so their keys alone go into an
          # isolated keyring: a good signature can only be theirs.
          export GNUPGHOME
          GNUPGHOME="$(mktemp -d)"
          gh api users/purpleclay/gpg_keys --jq '.[].raw_key' | gpg --batch --import
          if ! git verify-tag "$TAG"; then
            echo "::error::tag '$TAG' is not signed by an authorized signer (purpleclay)"
            exit 1
          fi

      - name: verify_on_main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag '$TAG' points at $GITHUB_SHA, which isn't on main"
            exit 1
          fi

      - name: verify_ci_passed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          conclusion=$(gh run list --commit "$GITHUB_SHA" --workflow ci.yml --branch main --event push \
            --json conclusion --jq '.[0].conclusion // ""')
          if [ "$conclusion" != success ]; then
            echo "::error::ci on main hasn't passed for $GITHUB_SHA (conclusion: ${conclusion:-none yet})"
            exit 1
          fi

  # Builds the release's install.sh once and attests it, so the script that's
  # deployed, the release asset and the attestation are the same bytes
  build:
    name: build
    needs: [verify]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write # sigstore keyless signing for build provenance
      attestations: write # publish the provenance attestation to the repo
    steps:
      - name: harden_runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            fulcio.sigstore.dev:443
            github.com:443
            rekor.sigstore.dev:443
            tmaproduction.blob.core.windows.net:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The repository's install.sh says it's version "dev". The released copy
      # says the release's version, so nothing needs bumping before a tag.
      - name: stamp_version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir dist
          sed "s/^INSTALLER_VERSION=.*/INSTALLER_VERSION=\"${TAG#v}\"/" install.sh >dist/install.sh
          # Exactly one line may change, so a renamed variable can't go out unstamped
          changed=$(diff install.sh dist/install.sh | grep -c '^>' || true)
          if [ "$changed" != 1 ] || ! grep -qx "INSTALLER_VERSION=\"${TAG#v}\"" dist/install.sh; then
            echo "::error::couldn't set INSTALLER_VERSION in install.sh to ${TAG#v}"
            exit 1
          fi

      - name: attest_build_provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/install.sh

      # Runs the verify command the README documents, before anything is
      # deployed, as an immutable release can't be fixed afterwards
      - name: verify_attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify dist/install.sh \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF"

      - name: upload_script
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-sh
          path: dist/install.sh
          if-no-files-found: error
          # Only this run needs it; the release keeps the lasting copy
          retention-days: 1

  deploy:
    name: deploy
    needs: [build]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      - name: harden_runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.cloudflare.com:443
            api.github.com:443
            cache.nixos.org:443
            get.purpleclay.io:443
            github.com:443
            releases.nixos.org:443

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install_nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: download_script
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: install-sh
          path: public

      - name: wrangler_deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: nix develop .#ci -c wrangler deploy

      # Cloudflare can take a few seconds to serve a new deploy everywhere, so
      # the checks are retried for about a minute before failing
      - name: smoke
        run: |
          check() {
            test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' https://get.purpleclay.io/)" \
              = "302 https://get.purpleclay.io/install.sh" ||
              { echo "/ doesn't redirect to /install.sh"; return 1; }
            curl -fsSI https://get.purpleclay.io/install.sh | grep -qi '^content-type: text/plain' ||
              { echo "/install.sh isn't served as text/plain"; return 1; }
            curl -fsSL https://get.purpleclay.io | cmp -s - public/install.sh ||
              { echo "The served script isn't the install.sh just deployed"; return 1; }
          }
          for attempt in 1 2 3 4 5 6; do
            if check; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              echo "Attempt $attempt failed, retrying in 10 seconds"
              sleep 10
            fi
          done
          echo "::error::get.purpleclay.io still doesn't serve the install.sh just deployed"
          exit 1

  # Published only once the script is live, so a release never describes a
  # version that isn't being served
  publish:
    name: publish
    needs: [deploy]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write # create the GitHub release and upload install.sh
    steps:
      - name: harden_runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            cafe.github.com:443
            github.com:443
            release-assets.githubusercontent.com:443
            tmaproduction.blob.core.windows.net:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
            uploads.github.com:443

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: download_script
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: install-sh
          path: dist

      - name: release_note
        id: notes
        uses: purpleclay/release-note-action@173903da3997acebdb2c04f3de707c7c4c1a283e # v0.3.1

      - name: publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NOTES_FILE: ${{ steps.notes.outputs.release-note-path }}
        run: |
          set -euo pipefail
          # Releases are immutable once published, so install.sh is attached
          # as the release is created. gh does that by creating a draft,
          # uploading, then publishing, so a failed run can leave a draft.
          create() {
            gh release create "$TAG" dist/install.sh --title "$TAG" --notes-file "$NOTES_FILE" --verify-tag
          }

          # gh exits 1 both when the release is missing and when the check
          # itself fails, so only the exact "release not found" message means
          # it's missing
          if ! release=$(gh release view "$TAG" --json isDraft,assets 2>&1); then
            if [ "$release" != "release not found" ]; then
              echo "::error::could not check for a release for '$TAG': $release"
              exit 1
            fi
            create
            exit 0
          fi

          # A draft was never published, so it can still be replaced
          if [ "$(jq -r .isDraft <<<"$release")" = true ]; then
            echo "replacing the draft release for '$TAG' left by an earlier run"
            gh release delete "$TAG" --yes
            create
            exit 0
          fi

          # A published release can't be changed, so it only counts as done if
          # it already carries this exact install.sh
          want="sha256:$(sha256sum dist/install.sh | cut -d ' ' -f 1)"
          have=$(jq -r '.assets[] | select(.name == "install.sh") | .digest' <<<"$release")
          if [ "$have" != "$want" ]; then
            echo "::error::the published release for '$TAG' doesn't carry this install.sh (found: ${have:-no install.sh}); releases are immutable, so tag a new patch release"
            exit 1
          fi
          echo "release for '$TAG' already carries this install.sh; nothing to publish"
