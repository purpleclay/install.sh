name: ci
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: harden_runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            cache.nixos.org:443
            github.com:443
            releases.nixos.org:443

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install_nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: shellcheck
        run: nix develop .#ci -c shellcheck -s sh install.sh

      - name: shfmt
        run: nix develop .#ci -c shfmt -d -s -i 2 -ci install.sh

  test:
    name: test (${{ matrix.shell }})
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shell: [dash, "bash --posix", "busybox sh"]
    permissions:
      contents: read
    steps:
      - name: harden_runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            cache.nixos.org:443
            github.com:443
            release-assets.githubusercontent.com:443
            releases.nixos.org:443
            tmaproduction.blob.core.windows.net:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install_nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: bats
        env:
          TEST_SHELL: ${{ matrix.shell }}
        run: nix develop .#ci -c bats test

      # Checks github.com still behaves the way the stubs assume. It tests
      # GitHub, not the shell, so it only needs to run once.
      - name: bats_live
        if: matrix.shell == 'dash'
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix develop .#ci -c bats test/live

